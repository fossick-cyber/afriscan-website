  - {id: S02, group: structures, name: "Concession, site and boundary encroachment survey", name_pt: "Ocupações em concessões, terrenos e limites", line: "Structures inside your concession, site or land-use boundary, in a ring around it, or both, mapped and listed so you can see where land is being occupied.", line_pt: "As construções dentro da sua concessão, terreno ou limite de uso da terra, numa faixa à sua volta, ou em ambos, mapeadas e listadas para mostrar onde a terra está a ser ocupada."}
  - {id: S03, group: structures, name: "Structures in hazard and impact zones", name_pt: "Estruturas em zonas de impacto e de segurança", line: "Structures inside the zones you define, such as tailings dam-break inundation areas, blast and exclusion zones, flood lines or safety setbacks, each listed with its location and distance to the source.", line_pt: "As construções dentro das zonas que definir, como áreas de inundação por rotura de barragens de rejeitados, zonas de explosão e de exclusão, linhas de cheia ou afastamentos de segurança, cada uma com a localização e a distância à origem."}
  - {id: S04, group: structures, name: "Route and site option comparison", name_pt: "Comparação de alternativas de traçado e de local", line: "Side-by-side structure counts along alternative pipeline, line or road alignments, or across candidate sites, so land impact can be weighed before a route is fixed.", line_pt: "Contagens de construções, lado a lado, ao longo de traçados alternativos de gasodutos, linhas ou estradas, ou em locais candidatos, para pesar o impacto sobre a terra antes de fixar o traçado."}
  - {id: S05, group: structures, name: "Area-wide structure mapping", name_pt: "Mapeamento de estruturas em grandes áreas", line: "A GIS layer of structures across a whole district, concession or imagery survey, ready to load into your own mapping system.", line_pt: "Uma camada SIG das construções de todo um distrito, concessão ou cobertura de imagens, pronta a carregar no seu sistema de cartografia."}
  - {id: S06, group: structures, name: "Reviewer-led structure mapping", name_pt: "Mapeamento de estruturas por revisores", line: "Where automatic detection is not enough, such as dense villages, mixed tree cover or unusual roofs, AfriScan reviewers mark structures by hand on high-resolution imagery.", line_pt: "Onde a detecção automática não chega, como em aldeias densas, sob cobertura arbórea mista ou com coberturas pouco comuns, os revisores da AfriScan marcam as construções à mão sobre imagens de alta resolução."}
  - {id: S07, group: structures, name: "Structure categories and attributes", name_pt: "Categorias e atributos das estruturas", line: "A reviewer tags each structure with what the imagery shows, such as main building, outbuilding, livestock enclosure, under construction or roof type, for resettlement and planning registers.", line_pt: "Um revisor classifica cada construção segundo o que a imagem mostra, como edifício principal, anexo, curral, construção em curso ou tipo de cobertura, para registos de reassentamento e de planeamento."}
  - {id: S08, group: change, name: "Change detection between dated surveys", name_pt: "Detecção de alterações entre levantamentos datados", line: "New and removed structures between two or more dated surveys, flagged automatically and confirmed by a reviewer, with before-and-after views of each change.", line_pt: "Construções novas e desaparecidas entre dois ou mais levantamentos datados, assinaladas automaticamente e confirmadas por um revisor, com vistas de antes e depois de cada alteração."}
  - {id: S09, group: change, name: "Scheduled re-surveys with change notices", name_pt: "Levantamentos periódicos com avisos de alterações", line: "Your route or site re-surveyed on a schedule agreed with you, with an email to your team after each survey saying what has changed and where.", line_pt: "O seu traçado ou terreno volta a ser levantado com a periodicidade acordada consigo e, depois de cada levantamento, a sua equipa recebe um e-mail a dizer o que mudou e onde."}
  - {id: S10, group: change, name: "Settlement growth trends", name_pt: "Tendências de crescimento dos assentamentos", line: "How built-up land has changed year by year around your assets, showing where settlement pressure is growing.", line_pt: "Como a área construída mudou de ano para ano à volta dos seus activos, mostrando onde a pressão dos assentamentos está a crescer."}
  - {id: S11, group: change, name: "Vegetation and land-cover change", name_pt: "Alterações da vegetação e da cobertura do solo", line: "Maps of where vegetation has been cleared, has regrown or has changed along servitudes, around plantations and forest estates, and across concessions, compared between dates.", line_pt: "Mapas dos locais onde a vegetação foi cortada, voltou a crescer ou mudou ao longo de servidões, à volta de plantações e florestas e em concessões, comparando datas."}
  - {id: S12, group: change, name: "Forest-loss and ground-disturbance alerts", name_pt: "Alertas de perda florestal e de perturbação do terreno", line: "Regular notices of tree-cover loss and ground disturbance inside or near your estate or concession, drawn from global satellite alert systems and checked by our team.", line_pt: "Avisos regulares de perda de cobertura arbórea e de perturbação do terreno dentro ou perto da sua propriedade ou concessão, a partir de sistemas globais de alerta por satélite e verificados pela nossa equipa."}
  - {id: S13, group: change, name: "Fire hotspot and burn-scar watch", name_pt: "Focos de incêndio e áreas queimadas", line: "Notices of satellite-detected fire hotspots near your lines, pipelines, plantations and sites, and maps of burnt areas after the fire.", line_pt: "Avisos de focos de incêndio detectados por satélite perto das suas linhas, gasodutos, plantações e instalações, e mapas das áreas queimadas depois do fogo."}
  - {id: S14, group: change, name: "All-weather radar change screening", name_pt: "Detecção de alterações por radar, mesmo com nuvens", line: "Radar satellite comparisons that show larger ground changes, such as clearing, earthworks and new large buildings, even under rainy-season cloud.", line_pt: "Comparações de imagens de radar por satélite que mostram as alterações maiores no terreno, como desmatações, movimentos de terra e grandes edifícios novos, mesmo com as nuvens da época chuvosa."}
  - {id: S15, group: change, name: "Rehabilitation and revegetation tracking", name_pt: "Acompanhamento da reabilitação e revegetação", line: "Progress of revegetation on rehabilitated mine land, closed borrow pits and restored servitudes, tracked between dates.", line_pt: "O progresso da revegetação em terrenos mineiros reabilitados, áreas de empréstimo encerradas e servidões recuperadas, acompanhado entre datas."}
  - {id: S16, group: change, name: "Construction and earthworks progress", name_pt: "Progresso de obras e de movimentos de terra", line: "Dated drone orthophotos and elevation models compared side by side, with maps of where ground has been cut or filled between visits.", line_pt: "Ortofotomapas e modelos de elevação de drone datados, comparados lado a lado, com mapas dos locais onde o terreno foi escavado ou aterrado entre visitas."}
  - {id: S17, group: change, name: "Boundary and perimeter change", name_pt: "Alterações nos limites e perímetros", line: "New structures, cleared ground and new tracks at your boundaries between dates, with fence lines and gates checked by a reviewer on drone imagery.", line_pt: "Novas construções, terreno desmatado e novos acessos nos seus limites entre datas, com as vedações e os portões verificados por um revisor em imagens de drone."}
  - {id: S18, group: features, name: "Track and access-route mapping", name_pt: "Mapeamento de picadas e acessos", line: "New tracks and access roads into your concession, across your right of way or around your site, mapped between dates.", line_pt: "Novas picadas e estradas de acesso para dentro da sua concessão, através da sua faixa de servidão ou à volta do seu local, mapeadas entre datas."}
  - {id: S19, group: features, name: "Structure detector tuned to your imagery", name_pt: "Detector de edifícios adaptado às suas imagens", line: "A building detector tuned to your own drone or satellite imagery and to local building styles, checked on part of your area before it is used on the rest.", line_pt: "Um detector de edifícios adaptado às suas imagens de drone ou de satélite e aos estilos de construção locais, verificado numa parte da área antes de ser usado no resto."}
  - {id: S20, group: features, name: "Custom object detection", name_pt: "Detecção de objectos à medida", line: "Detection of the objects that matter on your land, trained on examples from your own imagery and reported alongside structures in your GIS files and reports.", line_pt: "Detecção dos objectos que importam no seu terreno, treinada com exemplos das suas próprias imagens e apresentada junto das construções nos ficheiros SIG e nos relatórios."}
  - {id: S21, group: features, name: "Artisanal mining and excavation mapping", name_pt: "Mapeamento de mineração artesanal e escavações", line: "Pits, disturbed ground, spoil heaps and water-filled excavations mapped inside and around your mining right or concession, with new sites flagged between dates.", line_pt: "Covas, terreno revolvido, montes de terra e escavações com água mapeados dentro e à volta do seu direito mineiro ou concessão, com os novos locais assinalados entre datas."}
  - {id: S22, group: features, name: "Excavation and third-party works on rights of way", name_pt: "Escavações e obras de terceiros na faixa de servidão", line: "Fresh digging, spoil heaps, trenches and earthworks on or near your pipeline or cable right of way, flagged between surveys so your field teams know where to check.", line_pt: "Escavações recentes, montes de terra, valas e movimentos de terra na faixa de servidão do seu gasoduto ou cabo, ou perto dela, assinalados entre levantamentos para que as equipas de campo saibam onde verificar."}
  - {id: S23, group: features, only: [ng], name: "Artisanal refining signs and oil-impacted ground screening", name_pt: "", line: "Sites showing visible signs of artisanal refining, and oil-stained or dead vegetation near your pipelines and facilities, mapped and flagged for your security and environment teams to check."}
  - {id: S24, group: features, name: "Tanks, containers and stored materials", name_pt: "Tanques, contentores e materiais armazenados", line: "An inventory of tanks, containers, stockpiles and laydown areas on your sites and along your corridors, compared between dates.", line_pt: "Um inventário de tanques, contentores, pilhas de materiais e estaleiros nas suas instalações e ao longo dos seus corredores, comparado entre datas."}
  - {id: S25, group: features, name: "Plant and equipment on site", name_pt: "Máquinas e equipamentos em obra", line: "Heavy equipment, such as excavators and trucks, visible at construction sites, laydown yards and unexplained earthworks, recorded on each survey date.", line_pt: "Equipamento pesado, como escavadoras e camiões, visível em obras, estaleiros e movimentos de terra por explicar, registado em cada data de levantamento."}
  - {id: S26, group: features, name: "Describe-what-to-find search", name_pt: "Pesquisa por descrição", line: "Tell us in words what to look for, and we search your imagery for it, with every result checked by a reviewer.", line_pt: "Diga-nos por palavras o que procurar e pesquisamos as suas imagens, com cada resultado verificado por um revisor."}
  - {id: S27, group: terrain, name: "Terrain, slope and erosion screening", name_pt: "Declives, relevo e erosão", line: "Steep, erosion-prone and drainage-crossing stretches of your route or site highlighted from elevation data, with drone elevation models for detail where flown.", line_pt: "Troços íngremes, sujeitos a erosão ou com atravessamento de linhas de água no seu traçado ou terreno, assinalados a partir de dados de elevação, com modelos de elevação de drone para mais detalhe onde houver voo."}
  - {id: S28, group: terrain, name: "Flood-exposure screening", name_pt: "Exposição a cheias", line: "Structures, route segments and sites in historically flooded, low-lying or river-crossing areas, highlighted for planning and emergency preparedness.", line_pt: "Construções, troços do traçado e locais em zonas historicamente inundadas, baixas ou de atravessamento de rios, assinalados para o planeamento e a preparação para emergências."}
  - {id: S29, group: terrain, name: "Post-event flood and damage mapping", name_pt: "Mapeamento de cheias e danos após eventos", line: "After a cyclone or flood, a map of the flooded area and a reviewer's before-and-after check of structures and assets along your route or site.", line_pt: "Depois de um ciclone ou de uma cheia, um mapa da área inundada e a verificação por um revisor, antes e depois, das construções e bens ao longo do seu traçado ou terreno."}
  - {id: S30, group: terrain, name: "Vegetation height in servitudes", name_pt: "Altura da vegetação na faixa de servidão", line: "Where tall vegetation stands inside your power-line or pipeline servitude, mapped from drone elevation models and open canopy-height data.", line_pt: "Onde há vegetação alta dentro da servidão da sua linha de energia ou gasoduto, mapeada a partir de modelos de elevação de drone e de dados abertos de altura do coberto vegetal."}
  - {id: S31, group: baselines, name: "Resettlement cut-off-date baseline", name_pt: "Registo de referência na data de corte (reassentamento)", line: "A dated record of the structures in the project footprint at the cut-off date, with imagery, coordinates and IDs, to support your census and asset inventory under IFC Performance Standard 5.", line_pt: "Um registo datado das construções na área do projecto na data de corte, com imagens, coordenadas e identificadores, para apoiar o censo e o inventário de bens segundo a Norma de Desempenho 5 da IFC."}
  - {id: S32, group: baselines, exclude: [za], name: "Evidence packs for legal and community processes", name_pt: "Dossiês documentais para processos legais e comunitários", line: "Dated imagery, structure registers and maps packaged with file fingerprints and an independent timestamp, so you can show what was on the ground and when.", line_pt: "Imagens datadas, registos de construções e mapas reunidos com um código de verificação (hash SHA-256) de cada ficheiro e um carimbo temporal independente, para mostrar o que existia no terreno e quando."}
  - {id: S33, group: baselines, name: "Imagery history and land due diligence", name_pt: "Histórico de imagens e due diligence de terras", line: "The documented history of a parcel, route or site from archived satellite imagery and open datasets: what was built, cleared or changed, and roughly when.", line_pt: "O histórico documentado de um terreno, traçado ou local a partir de imagens de satélite históricas e de dados abertos: o que foi construído, desmatado ou alterado, e aproximadamente quando."}
  - {id: S34, group: baselines, name: "Location check for grievances and claims", name_pt: "Verificação de reclamações num local", line: "For a single point or claim, a sheet of every dated image covering it, so your team can see what was there on each date.", line_pt: "Para um único ponto ou reclamação, uma folha com cada imagem datada que o cobre, para que a sua equipa veja o que lá existia em cada data."}
  - {id: S35, group: baselines, name: "Household and population estimates", name_pt: "Estimativas de agregados familiares e população", line: "Estimated households and people from structure counts, for mini-grid sizing, service planning, consultation planning and health or census microplanning.", line_pt: "Estimativas de agregados familiares e de população a partir das contagens de construções, para dimensionar mini-redes, planear serviços e consultas públicas e apoiar a microplanificação de campanhas de saúde ou de recenseamento."}
  - {id: S36, group: baselines, name: "Land-use and land-cover baseline", name_pt: "Linha de base de uso e cobertura do solo", line: "A baseline map of built-up land, cropland, bare ground, water and tree cover around your project, combined with our structure register.", line_pt: "Um mapa de base da área construída, terras de cultivo, solo nu, água e cobertura arbórea à volta do seu projecto, combinado com o nosso registo de construções."}
  - {id: S37, group: capture, name: "Drone orthophoto and elevation survey", name_pt: "Levantamento por drone: ortofotomapa e modelos de elevação", line: "A georeferenced orthophoto, surface and terrain elevation models, a point cloud, a 3D model and a processing quality report from a drone survey of your site or corridor, subject to the approvals and security clearances each job requires.", line_pt: "Um ortofotomapa georreferenciado, modelos digitais de superfície e de terreno, uma nuvem de pontos, um modelo 3D e um relatório de qualidade do processamento, a partir de um levantamento por drone do seu local ou corredor, sujeito às autorizações e credenciações de segurança exigidas para cada operação."}
  - {id: S38, group: capture, name: "Drone checks of flagged areas", name_pt: "Verificação por drone das áreas assinaladas", line: "Satellite screening narrows the search, then drone flights over the flagged stretches capture the detail your team needs, subject to the approvals and security clearances each job requires.", line_pt: "O rastreio por satélite reduz a área a verificar; depois, voos de drone sobre os troços assinalados captam o detalhe de que a sua equipa precisa, sujeitos às autorizações e credenciações de segurança exigidas para cada operação."}
  - {id: S39, group: capture, name: "Stockpile and earthworks volumes", name_pt: "Volumes de pilhas e de movimentos de terra", line: "Volumes of stockpiles, spoil heaps, borrow pits and cut-and-fill areas calculated from drone elevation models.", line_pt: "Volumes de pilhas, montes de terra, áreas de empréstimo e zonas de escavação e aterro, calculados a partir de modelos de elevação de drone."}
  - {id: S40, group: capture, name: "Analysis of your own imagery", name_pt: "Análise das suas próprias imagens", line: "Send the drone orthophotos or satellite scenes you already have, and we run the same structure, change and corridor analysis on them.", line_pt: "Envie os ortofotomapas de drone ou as cenas de satélite que já tem, e fazemos sobre eles a mesma análise de construções, alterações e corredor."}
  - {id: S41, group: capture, name: "Very-high-resolution satellite imagery sourcing", name_pt: "Aquisição de imagens de satélite de muito alta resolução", line: "Dated, very-high-resolution satellite scenes of your area sourced from commercial archives, used in your analysis and delivered as imagery.", line_pt: "Cenas de satélite datadas de muito alta resolução da sua área, obtidas em catálogos comerciais, usadas na análise e entregues como imagens."}
  - {id: S42, group: capture, name: "New satellite capture of your site", name_pt: "Nova captação por satélite do seu local", line: "A new very-high-resolution satellite capture of your site or corridor, requested from commercial operators for when archive imagery is too old. The capture date depends on satellite availability and weather.", line_pt: "Uma nova captação por satélite de muito alta resolução do seu local ou corredor, pedida a operadores comerciais quando as imagens disponíveis são demasiado antigas. A data da captação depende da disponibilidade dos satélites e das condições meteorológicas."}
  - {id: S43, group: delivery, name: "PDF reports in English or Portuguese", name_pt: "Relatórios PDF em português ou inglês", line: "Clear PDF reports with maps, route tables, a photo of each structure and a coordinate register, in English or Portuguese.", line_pt: "Relatórios PDF claros, com mapas, tabelas por troço, uma fotografia de cada construção e um registo de coordenadas, em português ou inglês."}
  - {id: S44, group: delivery, name: "GIS deliverables", name_pt: "Ficheiros SIG", line: "GeoPackage, GeoJSON, KMZ and Shapefile layers that open in QGIS, ArcGIS and Google Earth.", line_pt: "Camadas GeoPackage, GeoJSON, KMZ e Shapefile que abrem no QGIS, no ArcGIS e no Google Earth."}
  - {id: S45, group: delivery, name: "Interactive map file", name_pt: "Mapa interactivo em ficheiro", line: "A self-contained interactive map of your results that your team can open in a web browser, including in the field.", line_pt: "Um mapa interactivo e autónomo dos resultados, que a sua equipa pode abrir num navegador, incluindo no terreno."}
