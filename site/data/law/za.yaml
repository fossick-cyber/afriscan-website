# South Africa: the instruments behind /za/drone-regulations and /za/popia.
# Facts ONLY from regional/za.FINAL.md and its full corrected brief za.verified.md (verified 2026-09-26).
# Items the brief marks [unverified] stay out: CIPA's commencement, the POPIA Amendment Regulations
# 2025, the G3/G4 code meanings, SANParks' national-parks position. No fee, fine or penalty amounts
# are published here or on the pages (owner rule 1): link to the gazette instead.
country_name: South Africa
last_reviewed: 2026-09-26
regulator:
  name: South African Civil Aviation Authority (SACAA)
  url: https://www.caa.co.za/industry-information/uas/
summary:
  regulator: South African Civil Aviation Authority (SACAA) for the operator certificate, aircraft and pilots; the Air Service Licensing Council for the Air Service Licence
  instruments: Civil Aviation Regulations Parts 101 and 71, as substituted by the 26th Amendment (2023) and amended by the 33rd Amendment (21 August 2026); Air Services Licensing Act 115 of 1990
instruments:
