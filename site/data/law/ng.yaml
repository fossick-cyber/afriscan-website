    last_checked: 2026-09-26
    note: ATC clearance before any flight in controlled or restricted airspace, under Nig.CARs 21.9.6.32; names Lagos and Port Harcourt.
  - id: civil-aviation-act-2022
    title: Civil Aviation Act 2022
    identifier: Act No. 30, Official Gazette No. 153, Vol. 109 (Government Notice 107)
    date: 2022-08-24
    url: https://ncaa.gov.ng/media/sxxn42yu/civil-aviation-act-2022-publi9cation.pdf
    last_checked: 2026-09-26
    note: Enforcement, detention and seizure (s.78), liability for damage on the ground (s.79), dangerous flying (s.81), failure to report (s.82(4)).
  - id: nuprc-ogisp-2024
    title: NUPRC Oil and Gas Industry Service Permit (OGISP) Guidelines 2024
    identifier: OGISP Guidelines 2024, cl. 2.1.12
    date: 2024-01-29
    url: https://ogisp.nuprc.gov.ng/Content/ApplicationGuideLines/OGISPGUIDELINE2024.pdf
    last_checked: 2026-09-26
    note: Service companies offering drone-based security services must show NCAA and ONSA approvals.
  - id: survey-coordination-act
    title: Survey Co-ordination Act (1962 No. 28, as amended by 1968 No. 42)
    identifier: Laws of the Federation of Nigeria 2004 (PLAC compilation)
    date: 1962-09-13
    url: https://lawsofnigeria.placng.org/view2.php?sn=501
    last_checked: 2026-09-26
    note: Three months' notice to the Director of Federal Surveys before survey work, including aerial photography for survey purposes (s.1).
  - id: official-secrets-act
    title: Official Secrets Act (1962 No. 29)
    identifier: Laws of the Federation of Nigeria 2004 (PLAC compilation)
    date: 1962                      # year only: the brief gives no day for this Act
    url: https://lawsofnigeria.placng.org/view2.php?sn=421
    last_checked: 2026-09-26
    note: Photographing or recording protected places (s.2); penalties (s.7).
  - id: ncaa-fees-2023
