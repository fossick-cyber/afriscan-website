  - id: nigcars-part2
    title: Nigeria Civil Aviation Regulations 2023, Part 2 (Personnel Licensing)
    identifier: S.I. 61, Official Gazette No. 144 (Government Notice 117)
    date: 2023-08-11
    url: https://ncaa.gov.ng/media/mvmk433o/nigcars-part-2-personnel-licensing.pdf
    last_checked: 2026-09-26
    note: The Remote Pilot Licence (2.3.11).
  - id: nigcars-part10
    title: Nigeria Civil Aviation Regulations 2023, Part 10 (Commercial Air Transport by Foreign Air Operators within Nigeria)
    identifier: S.I. 69, Official Gazette of 30 August 2023 (Government Notice 125)
    date: 2023-08-30
    url: https://ncaa.gov.ng/media/0qll0mio/nigcars-part-10-commercial-air-transport-by-foreign-air-operators-within-nigeria.pdf
    last_checked: 2026-09-26
    note: Foreign operators of remotely piloted aircraft (10.8.1.1).
  - id: ncaa-ac-aws061
    title: NCAA Advisory Circular NCAA-AC-AWS061 (RPA operations)
    identifier: NCAA-AC-AWS061
    date: 2023-04-10
    url: https://ncaa.gov.ng/media/jjah0hhl/ncaa-ac-aws061.pdf
    last_checked: 2026-09-26
    note: ONSA security clearance as a condition of commercial, corporate and government-civil operation (App. 4 and 5); lead times; insurance; landowner rights (12.7.1).
  - id: ncaa-aol-24-29
    title: NCAA All Operators Letter on flying in controlled airspace
    identifier: NCAA/DGCA/AOL/24/29
    date: 2025-06-20
