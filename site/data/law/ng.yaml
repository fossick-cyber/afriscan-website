# Nigeria: the instruments the drone-law and compliance page (/ng/drone-regulations) relies on.
# Facts ONLY from regional/ng.FINAL.md (verified 2026-09-26 against the Official Gazette texts and
# the regulators' own documents). Dates are the Gazette, signature or document dates given there, or
# the commencement date printed in the PLAC compilation (Survey Co-ordination Act). The Official
# Secrets Act carries its year only (1962 No. 29), because the brief gives no day for it. Items the brief marks [unverified] stay out: the NDPC GAID, the radio-licence issuer, the
# contents of NCAA's truncated "RPAS/UAV guidelines" PDF. Documents without a full date (NCAA-AC-GEN007
# and NCAA's own April 2023 edition of Part 21, both "April 2023"; the RPAS Portal; the ONSA EUC
# pages; the NDPA, whose commencement date is blank in the PLAC scan) are cited with links in the page
# body instead of this table. No fee, fine or penalty amount appears anywhere (owner rule 1).
country_name: Nigeria
last_reviewed: 2026-09-26
regulator:
  name: Nigeria Civil Aviation Authority (NCAA)
  url: https://ncaa.gov.ng/documents/regulations/nigcars-2023-official-gazette/
summary:
  regulator: Nigeria Civil Aviation Authority (NCAA), with ONSA security clearance built into certification
  instruments: Nig.CARs 2023 Part 21 (RPAS), S.I. 82 of 22 September 2023; Part 11 (aerial work); Civil Aviation Act 2022
instruments:
  - id: nigcars-part21
    title: Nigeria Civil Aviation Regulations 2023, Part 21 (Remotely Piloted Aircraft Systems)
    identifier: S.I. 82, Official Gazette No. 169, Vol. 110 (Government Notice 143)
    date: 2023-09-22
    url: https://ncaa.gov.ng/media/wabn2axn/nigcars-part-21-remotely-piloted-aircraft-system.pdf
    last_checked: 2026-09-26
    note: Mass classes (21.2.1.1), registration (21.3), the RPAS Operator Certificate (21.4), operating rules (21.9), security (21.13), insurance (21.17), privacy (21.18).
  - id: nigcars-part11
    title: Nigeria Civil Aviation Regulations 2023, Part 11 (Aerial Work)
    identifier: S.I. 72, Official Gazette No. 159 (Government Notice 132)
