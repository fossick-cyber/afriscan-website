    url: https://ncaa.gov.ng/media/1lrh3ff2/nigcars-part-11-aerial-work.pdf
    last_checked: 2026-09-26
    note: The RPA aerial-work application, form IS 11.1.1.1(F) (11.1.1.1(f)); the PAAS and Aerial Work Certificate rule (11.1.1.4(a)).
  - id: nigcars-part18
    title: Nigeria Civil Aviation Regulations 2023, Part 18 (Air Transport Economic Regulations)
    identifier: S.I. 79, Official Gazette No. 166 (Government Notice 140)
    date: 2023-09-18
    url: https://ncaa.gov.ng/media/kpjldhy3/nigcars-part-18-air-transport-economics.pdf
    last_checked: 2026-09-26
