# DR Congo: the instruments the drone-law pages (/cd/drone-regulations, /cd/fr/loi-sur-les-drones)
# and the subcontracting pages (/cd/subcontracting, /cd/fr/sous-traitance) rely on. Facts ONLY from
# fhc-notes/website/regional/cd.FINAL.md (verified 2026-09-27). Left out on purpose:
#   - fine and levy amounts (owner rule: no currency amounts or regulators' charges), including
#     the 1.2 % ARSP levy of AM n° 01/2021;
#   - anything the brief marks [unverified] or [secondary]: an AAC drone regulation or registration
#     procedure (none was published on 27 Sep 2026), the ministerial arrêté on AAC fine rates, the
#     unamended "travail aérien" articles, any security-clearance text, the Code du Numérique
#     (primary text not read), the rest of Loi n° 26/017 beyond the columns read, Loi n° 26/018.
# Titles are the official French titles, so the same rows read correctly on the English and French
# pages; identifiers carry only numbers and article references for the same reason. The servitude,
# electricity and mining texts are cited inline on their own pages, not here, so this Sources
# table stays about drones and subcontracting.
