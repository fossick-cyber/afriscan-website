# Zambia: the instruments behind /zm/drone-regulations.
# Facts ONLY from regional/zm.FINAL.md and its corrected full brief zm.verified.md (verified 2026-09-27
# against ZCAA's document and RPAS downloads and the Parliament of Zambia act PDFs).
# Items the brief marks [unverified] stay out or are stated as open questions on the page: whether each
# Cap. 125 order survives in the 2019 Revised Edition, the use of the ZAF clearance portal for drones,
# ZICTA's type-approval practice for drones, any drone rule for national parks. Instruments the brief
# gives without a date (the Protected Places and Areas Act, Cap. 125; the State Security Act, Cap. 111;
# the Land Survey Act, Cap. 188) are cited with links in the page body instead of this table. Year-only
# dates are used where the brief gives only the year or the month. No fee, fine or penalty-unit amount
# appears here or on the page (owner rule 1), and ZCAA's service-charter processing times are left out.
country_name: Zambia
last_reviewed: 2026-09-27
regulator:
  name: Zambia Civil Aviation Authority (ZCAA)
  url: https://www.caa.co.zm/rpas
summary:
  regulator: Zambia Civil Aviation Authority (ZCAA), through its UAV & Aircraft Certification Unit; Zambia Air Force airspace clearance for every operation
  instruments: Zambia Civil Aviation Requirements Part 18 (RPAS), Rev 0, June 2016; Civil Aviation Act 2016 (Cap. 444), amended in 2024 and 2026; ZCAA circulars AIC 004, 005 and 007 of 2026
