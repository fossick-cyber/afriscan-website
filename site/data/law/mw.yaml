# Malawi: the instruments the /mw/ pages rely on (/mw/drone-regulations, and the :::sources lists on
# /mw/power-lines and /mw/road-and-rail-reserves).
# Facts ONLY from regional/mw.FINAL.md (verified 2026-09-27 against the MalawiLII texts, the MCAA
# site, the gazette PDF of the Land Survey Regulations 2020 and the Data Protection Act 2024 PDF).
# Links go to the MalawiLII texts the brief read (through Internet Archive captures) or to the
# regulator's own PDF. Items the brief marks [unverified] stay out: the text of the Land Survey
# (Amendment) Act 2022 (only its commencement is cited), the commencement and effect of the
# Electricity (Amendment) Act 2024 (only its publication is cited), the Mines and Minerals Act 2023
# (uncommenced on MalawiLII), MACRA type approval of drone radios, any MCAA drone form, fee or
# timeline, and the rail-reserve width. The Communications Act 2016 is cited for type approval only.
# No fee, fine or penalty amount appears anywhere (owner rule 1): the pages name the offences only.
country_name: Malawi
last_reviewed: 2026-09-27
regulator:
  name: Malawi Civil Aviation Authority (MCAA)
  url: https://www.caa.gov.mw/
summary:
  regulator: Malawi Civil Aviation Authority (MCAA), with the Surveyor General for the aerial-survey notice and deposit and for drone registration in survey work
  instruments: Civil Aviation Act 2017 (in force 1 September 2020), with no gazetted drone regulations; Land Survey Act s.42; Land Survey Regulations 2020, reg. 100
instruments:
  - id: caa-2017
    title: Civil Aviation Act 2017
    identifier: Act No. 28 of 2017; in force 1 September 2020 (GN 88 of 2020)
    date: 2017-08-22
    url: https://malawilii.org/akn/mw/act/2017/28/eng@2017-08-22
    last_checked: 2026-09-27
    note: Definitions (s.2), certificates, licences and authorisations (s.43), offences (ss.64, 76, 78), exemptions (s.79), liability (s.80), restricted areas (s.82), rules and directives (s.89), saved regulations (s.96(3)).
  - id: aviation-registration-2013
    title: Aviation (Aircraft Registration and Marking) Regulations 2013
    identifier: GN 30 of 2013
    date: 2013
    url: https://www.caa.gov.mw/wp-content/uploads/2025/11/Aviation-Regulations-2013-AIRCRAFT-REGISTRATION-AND-MARKING.pdf
    last_checked: 2026-09-27
    note: Registration before operation (reg. 3) and who may register an aircraft in Malawi (reg. 4).
  - id: aviation-aerial-work-2013
    title: Aviation (Aerial Work) Regulations 2013
    identifier: GN 37 of 2013
    date: 2013
    url: https://www.caa.gov.mw/wp-content/uploads/2025/11/Aviation-Regulations-2013-AERIAL-WORK-1.pdf
    last_checked: 2026-09-27
    note: Saved by the 2017 Act; none of its operations covers remotely piloted aircraft.
  - id: land-survey-act
    title: Land Survey Act
    identifier: Cap. 59:03, consolidated text
    date: 2017-12-31
    url: https://malawilii.org/akn/mw/act/1952/14/eng@2017-12-31
    last_checked: 2026-09-27
    note: "\"Survey\" includes aerial surveys (s.2); the 30-day notice, the deposit and the offence (s.42)."
  - id: land-survey-amendment-2022
    title: Land Survey (Amendment) Act 2022, commencement notice
    identifier: GN 25 of 2022
    date: 2022-07-01
    url: https://malawilii.org/akn/mw/act/gn/2022/25/eng@2022-07-01
    last_checked: 2026-09-27
    note: In force 1 July 2022. The amending text was not reviewed for these pages.
  - id: land-survey-regs-2020
    title: Land Survey Regulations 2020
    identifier: GN 49 of 2020
    date: 2020-08-12
    url: https://malawilii.org/akn/mw/act/gn/2020/49/eng@2020-08-12
    last_checked: 2026-09-27
    note: Imagery for customary-estate demarcation (regs 92–93); registration of GNSS receivers, including drones, used in survey and mapping work (reg. 100), after the Surveyor General's checks and tests (reg. 101).
  - id: protected-places-act
    title: Protected Places and Areas Act
    identifier: Cap. 14:04
    date: 2014-12-31
    url: https://malawilii.org/akn/mw/act/1960/6/eng@2014-12-31
    last_checked: 2026-09-27
    note: Protected places (s.4) and protection measures (s.7).
  - id: procurement-regs-2020
    title: Public Procurement Regulations 2020
    identifier: GN 24 of 2020, Fourth Schedule
    date: 2020-06-17
    url: https://malawilii.org/akn/mw/act/gn/2020/24/eng@2020-06-17
    last_checked: 2026-09-27
    note: Lists unmanned aerial systems among national security or defence related items.
  - id: communications-act-2016
    title: Communications Act 2016
    identifier: Act No. 34 of 2016, s.96 (type approval)
    date: 2016
    url: https://malawilii.org/akn/mw/act/2016/34/eng@2017-12-31
    last_checked: 2026-09-27
  - id: dpa-2024
    title: Data Protection Act 2024
    identifier: Act No. 3 of 2024; commenced by GN 40 of 2024
    date: 2024-02-02
    url: https://www.dpa.mw/download/data-protection-act-2024/
    last_checked: 2026-09-27
    note: Breach notice (ss.36–37), transfers out of Malawi (ss.38–40), registration (s.41).
  - id: electricity-act
    title: Electricity Act
    identifier: Cap. 73:01, consolidated text
    date: 2017-12-31
    url: https://malawilii.org/akn/mw/act/2004/22/eng@2017-12-31
    last_checked: 2026-09-27
    note: Wayleaves over land (s.39); trees, buildings and structures in the wayleave (s.41).
  - id: electricity-amendment-2024
    title: Electricity (Amendment) Act 2024
    identifier: Act No. 19 of 2024
    date: 2024-05-31
    url: https://malawilii.org/akn/mw/act/2024/19/eng@2024-05-31
    last_checked: 2026-09-27
    note: Published 31 May 2024. Its commencement and its effect on ss.39 and 41 were not confirmed for these pages.
  - id: public-roads-act
    title: Public Roads Act
    identifier: Cap. 69:02, consolidated text
    date: 2017-12-31
    url: https://malawilii.org/akn/mw/act/1962/11/eng@2017-12-31
    last_checked: 2026-09-27
    note: Road-reserve widths and written consent (s.10(6)); encroachment and removal notices (s.36(4)).
  - id: public-roads-amendment-2017
    title: Public Roads (Amendment) Act 2017
    identifier: Act No. 8 of 2017
    date: 2017-01-27
    url: https://malawilii.org/akn/mw/act/2017/8/eng@2017-01-27
    last_checked: 2026-09-27
  - id: land-act-2016
    title: Land Act 2016
    identifier: Act No. 16 of 2016 (Cap. 57:01), consolidated text
    date: 2017-12-31
    url: https://malawilii.org/akn/mw/act/2016/16/eng@2017-12-31
    last_checked: 2026-09-27
    note: Acquisition of unallocated customary land for public utility (s.17) and compensation (s.18). A 2022 amendment, in force 1 July 2022, was not reviewed for these pages.
  - id: lands-acquisition-act
    title: Lands Acquisition and Compensation Act
    identifier: Cap. 58:04, consolidated text
    date: 2017-12-31
    url: https://malawilii.org/akn/mw/act/1970/21/eng@2017-12-31
    last_checked: 2026-09-27
  - id: environment-management-act
    title: Environment Management Act 2016
    identifier: Act 19 of 2017; in force 1 November 2019 (GN 73 of 2019)
    date: 2017-05-05
    url: https://malawilii.org/akn/mw/act/2017/19/eng@2017-05-05
    last_checked: 2026-09-27
    note: No prescribed project may be implemented without an approved environmental and social impact assessment (s.31).
