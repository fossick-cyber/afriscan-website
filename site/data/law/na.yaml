# Namibia: the instruments behind /na/drone-regulations.
# Facts ONLY from regional/na.FINAL.md (na.verified.md has the same content; checked 2026-09-27 against
# the NCAA texts, the AIP and the LAC statute copies). Items the brief marks [unverified] or [counsel]
# stay out as facts: whether new RPAS regulations are due, whether NCAA applies Part 114 to every RPA
# crew, whether the Air Services Act licence applies to drone survey work, how drones are registered,
# whether a Diamond Act permit covers overflight. Those are stated on the page as open questions.
# No fee, fine or penalty amount appears here or on the page (owner rule 1): link to the gazette.
# Government Gazette 6763 (GN 293 of 2018: Part 185 substituted, Part 114 inserted) has no public link
# in the brief, so the page cites it in the text and links NCAA's regulations index, which lists it.
country_name: Namibia
last_reviewed: 2026-09-27
regulator:
  name: Namibia Civil Aviation Authority (NCAA)
  url: https://www.ncaa.com.na/
summary:
  regulator: Namibia Civil Aviation Authority (NCAA), with ANSSO for airspace approvals
  instruments: NAMCAR Part 101 (substituted by GN 89 of 2020); NCAA Aviation Directives 1/2/3-6 (RPAS Letter of Approval and Operator Certificate) and 1/2/4-1 (remote pilot certificates); Civil Aviation Act 6 of 2016
