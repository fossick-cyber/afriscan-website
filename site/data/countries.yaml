# Every African country (the 54 UN members), for grouping the country sites by region and for the
# /countries hub. build.py validates this file against data/locales.yaml.
#
#   key         ISO 3166-1 alpha-2, lower case (a section's `country` in locales.yaml, lower-cased)
#   name        English short name
#   region      Southern | East | West | Central | North (the region headings in data/i18n/*.yaml `regions`)
#   languages   site languages the country research recommends, primary first (ISO 639-1), from
#               fhc-notes/website/regional/<key>.FINAL.md or <key>.md; null where there is no research
#   status      live       a live section on the site
#               launching  pre-registered in locales.yaml (status: draft until its branch flips it live)
#               research   research only: no section, never linked
#   timezones   IANA zones the country-site banner uses as a fallback when /geo gives no country
#
# The site shows a country only when one of its sections in locales.yaml is status: live; `status`
# here records where each country stands. When a section goes live, set its country's status to live
# (the build warns until you do). One block per country keeps parallel edits merge-friendly.

# ------------------------------------------------------------------ Southern Africa
za:
  name: South Africa
  region: Southern
  languages: [en]
  status: live
  timezones: [Africa/Johannesburg]
mz:
  name: Mozambique
  region: Southern
  languages: [pt, en]
  status: live
  timezones: [Africa/Maputo]
