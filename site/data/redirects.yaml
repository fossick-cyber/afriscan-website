# Path redirects only -> dist/_redirects. Host redirects (www, pages.dev) are in
# functions/_middleware.js (the deploy token cannot create Bulk Redirects); ccTLDs would be Bulk
# Redirects. A rule whose target page is not built is skipped (so the country aliases switch on by
# themselves when those sections launch). A published slug is
# permanent: any rename adds a line here in the same commit.
- [/pricing, /how-we-work, 301]
- [/pricing.html, /how-we-work, 301]
- [/pricing/, /how-we-work, 301]
- [/use-cases, /solutions, 301]
- [/pt, /mz/pt/, 301]
- [/pt/, /mz/pt/, 301]
- [/mozambique, /mz/, 301]
- [/mocambique, /mz/pt/, 301]
- [/south-africa, /za/, 301]
- [/nigeria, /ng/, 301]
- [/sample-outputs, /results, 301]
- [/drone-law, /drone-regulations, 301]
# 2026-09-27: the sample route is no longer named (owner decision). Two social cards were redrawn and
# its images renamed; files under the old names carried the name, so every old URL redirects. Static
# rules come before the splats, which Cloudflare matches more slowly.
- [/assets/og/results-5a769a9017.jpg, /results, 301]
- [/assets/og/results-7e2803fcc4.jpg, /results, 301]
- [/assets/og/mz-pt-resultados-de-exemplo-c67a4a7912.jpg, /mz/pt/resultados-de-exemplo, 301]
- [/assets/og/mz-pt-resultados-de-exemplo-ef42a5aadd.jpg, /mz/pt/resultados-de-exemplo, 301]
# 2026-09-28: three social cards redrawn for the 15-country launch; the URLs live on 3de7855 go to their page.
- [/assets/og/countries-b8149a5593.jpg, /countries, 301]
- [/assets/og/drone-regulations-07913730f9.jpg, /drone-regulations, 301]
- [/assets/og/solutions-drone-surveys-bd7440315f.jpg, /solutions/drone-surveys, 301]
# Pre-2026-09-26 site: its sample images carried the old captions. Cloudflare keeps serving a removed
# file from its asset preservation cache for up to a week, and redirects apply before that lookup.
- [/assets/examples/*, /results, 301]
# The sample images renamed on 2026-09-27 (every current name starts samples-sample-): one splat covers
# the old names without spelling them out. The build refuses a rule that would hide a published file.
- [/assets/img/samples-t*, /results, 301]
