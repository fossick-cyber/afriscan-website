# Path redirects only -> dist/_redirects. Host redirects (www, pages.dev) are in
# functions/_middleware.js (the deploy token cannot create Bulk Redirects); ccTLDs would be Bulk
# Redirects. A rule whose target page is not built is skipped (so the country aliases switch on by
# themselves when those sections launch). A published slug is
# permanent: any rename adds a line here in the same commit.
- [/pricing, /how-we-work, 301]
- [/pricing.html, /how-we-work, 301]
- [/pricing/, /how-we-work, 301]
- [/use-cases, /solutions, 301]
- [/pt, /mz/pt/, 301]
- [/pt/, /mz/pt/, 301]
- [/mozambique, /mz/, 301]
- [/mocambique, /mz/pt/, 301]
- [/south-africa, /za/, 301]
- [/nigeria, /ng/, 301]
- [/sample-outputs, /results, 301]
- [/drone-law, /drone-regulations, 301]
# Pre-2026-09-26 site: its sample images carried the old captions. Cloudflare keeps serving a removed
# file from its asset preservation cache for up to a week, and redirects apply before that lookup.
- [/assets/examples/*, /results, 301]
