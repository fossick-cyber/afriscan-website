# Human reviews a page needs before it can go live, and the pages published before theirs.
#
#   native_<lang>  every page in a language other than English: a native reviewer for that language and
#               country signs the rendered page off (architecture.FINAL §6.1(3), §6.3(4)). The list name is
#               native_ + the page's lang lower-cased with "-" as "_" (pt-AO -> native_pt_ao, fr-CD ->
#               native_fr_cd), except pt-MZ, whose list keeps its first name, native_pt.
#               Front matter: reviewed_on, reviewed_by_role.
#   counsel     every country drone-law page (template: law) and the pages listed under
#               counsel_required: counsel for that country reviews it (architecture.FINAL §6.3(5);
#               ZA and NG brief copy rules). Front matter: counsel_reviewed_on, counsel_reviewed_by_role.
#               Entries may also go in lists named counsel_<anything> (e.g. counsel_zm), which count the same.
#
# The build FAILS on a page that needs a review and has neither the sign-off in its front matter nor
# an entry below. The entries below are the pages the owner put live before these reviews happened;
# the build prints one WARN per open review, with the owner's decision date. When a real reviewer signs a
# page off, set the front-matter fields on the page and delete its entry here in the same commit. Never
# invent a review, a reviewer or a date, and never add a page here without the owner's decision.
#
# Owner decisions: 2026-09-26 "Just make it all live" (the MZ/ZA/NG launch); 2026-09-27 publish the new
# country sites before their counsel and native reviews. The date that applies to an entry is, in order:
#   - the entry's own:      /zm/drone-regulations: {reviewer: Zambian counsel, owner_decision: 2026-09-27}
#                           or, in a list,  - {url: /ao/pt/, owner_decision: 2026-09-27}
#   - its list's:           native_pt_ao: {owner_decision: 2026-09-27, pages: [/ao/pt/, …]}
#   - the file's:           owner_decision below.
owner_decision: 2026-09-26

counsel_required:
  - /mz/pt/zona-de-proteccao-parcial-50-metros
  - /mz/pt/fornecedor
  # Zambia: the wayleave guide and the procurement page state the law, so counsel reviews them too
  - /zm/wayleave-guide
  - /zm/procurement
  # Tanzania: the wayleave-law guide is an article rather than a law page, but it states the law, so counsel reviews it too
  - /tz/wayleave-law
  # DR Congo: the brief's launch gate asks counsel to review the supplier and power-line pages too (regional/cd.FINAL.md, Content plan)
  - /cd/fr/sous-traitance
  - /cd/subcontracting
  - /cd/fr/emprises-lignes-electriques
  - /cd/power-lines
  # Angola: the local-content page states the law, so counsel reviews it too
  - /ao/pt/conteudo-local
  # Malawi: they cite Electricity Act and Public Roads Act sections Malawian counsel is to confirm (mw.FINAL.md)
  - /mw/power-lines
  - /mw/road-and-rail-reserves

