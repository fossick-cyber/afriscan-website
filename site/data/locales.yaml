# One entry per site section. The country selector groups sections by region and lists countries by
# their English name (data/countries.yaml); a country's language variants stay together, in the order
# they appear here (primary language first).
#   content   folder under site/content/
#   prefix    URL prefix ("" for the global site). Section home = prefix + "/".
#   lang      the pages' <html lang>
#   hreflang  every code this section's pages carry. The first is the page's own locale; the rest
#             are catch-alls (Google: "provide a catchall URL for geographically unspecified users").
#             Catch-alls: "pt" stays on mz-pt, "fr" is on cd-fr.
#   i18n      UI strings file in data/i18n/ (a live section needs its file; a draft one falls back to en)
#   country   ISO code (null for global); country_name is in the section's own language
#   status    live  -> built and published
#             draft -> built only with build.py --drafts (noindex, "Draft: not published" banner), and never
#                      linked, listed, clustered or suggested from a published page. A draft section with
#                      no pages yet builds fine. A country branch flips its section to live.
#   region    Southern | East | West | Central | North (null for global); must match data/countries.yaml
global:
  content: global
  prefix: ""
  lang: en-GB
  hreflang: [en, x-default]
  og_locale: en_GB
  i18n: en
  country: null
  country_name: null
  label: "Global (English)"
  short: "Global"
  sitemap: sitemap-global.xml
  status: live
  region: null
mz-pt:
  content: mz/pt
  prefix: /mz/pt
  lang: pt-MZ
  hreflang: [pt-MZ, pt]
  og_locale: pt_PT
  i18n: pt-MZ
  country: MZ
  country_name: Moçambique
  label: "Moçambique (Português)"
  short: "Moçambique · PT"
  sitemap: sitemap-mz.xml
  status: live
  region: Southern
mz-en:
  content: mz/en
  prefix: /mz
  lang: en-MZ
  hreflang: [en-MZ]
  og_locale: en_GB
  i18n: en
  country: MZ
  country_name: Mozambique
  label: "Mozambique (English)"
  short: "Mozambique · EN"
  sitemap: sitemap-mz.xml
  status: live
  region: Southern
