# French (RD Congo) names, menu lines and blurbs for the catalogue industries, solution groups and
# solutions, for the /cd/fr/ menus, footer and cards. NOT read by today's build: build.py picks
# catalogue names with `lang = "pt" if … else "en"`, so /cd/fr/ pages still show the English names.
# For the integrator: merge each entry below into data/catalogue.yaml as an `fr:` value next to `en:`
# and `pt:` (name, menu, blurb), and make build.py choose "fr" for fr-* sections with a fallback to
# "en" (build.py lines 223, 355, 532, 585, 738, 797, 807 on 3de7855). Same vocabulary rules as the
# pages: emprise, servitude, périmètre, constructions, fosses, terres remuées; never "intrusion",
# "surveillance" or "risque" for a rating. Native Congolese review pending with the /cd/fr/ pages.

industries:
  oil-gas:
    name: "Pétrole et gaz"
    menu: "Pipelines, emprises, plateformes de puits, sites de GNL et de gaz"
    blurb: Constructions dans les emprises et les zones de protection des pipelines, zones de sécurité autour des installations et des sites de GNL, et fouilles récentes près des conduites.
  mining:
    name: "Mines"
    menu: "Concessions, parcs à résidus et zones de danger, réinstallation, réhabilitation"
    blurb: Limites et abords des concessions, constructions dans les zones de résidus et de danger, fouilles en surface, registres initiaux pour la réinstallation et réhabilitation.
  power-utilities:
    name: "Électricité et eau"
    menu: "Emprises et servitudes des lignes, postes, adductions d'eau, barrages"
    blurb: Emprises et servitudes des lignes de transport et de distribution, végétation et feux près des lignes, conduites d'eau et barrages, et tracés des lignes nouvelles.
  project-finance-esia:
    name: "Financement de projets et EIES"
    menu: "Bailleurs, contrôleurs indépendants, bureaux d'études EIES et PAR, équipes de réinstallation"
    blurb: Registres à la date butoir, états initiaux pour les équipes EIES et PAR, et informations datées entre deux visites pour les bailleurs et les contrôleurs indépendants.
  rail-roads:
    name: "Rail et routes"
    menu: "Emprises ferroviaires et routières, zones non aedificandi, nouveaux tracés"
    blurb: Constructions le long des voies ferrées et des routes, mesurées par rapport à leurs emprises, et registres datés pour les nouveaux tracés.
  renewables:
    name: "Énergies renouvelables"
    menu: "Sites solaires et éoliens et leurs lignes de raccordement"
    blurb: Historique des terrains, constructions et évolution de l'occupation du sol sur les sites solaires et éoliens et leurs lignes de raccordement, avant et pendant les travaux.
  agriculture-forestry-nature:
    name: "Agriculture, forêts et nature"
    menu: "Domaines, plantations, aires protégées et compensations"
    blurb: Défrichements, évolution des limites, nouvelles pistes et constructions dans les domaines, les plantations, les aires protégées et les compensations de biodiversité.
  government:
    name: "Programmes publics"
    menu: "Domaine public, aménagement, accès à l'énergie, relèvement après les inondations"
    blurb: Couches de constructions et ménages estimés pour la planification, et cartographie avant et après sur le domaine public, les programmes et les zones touchées par des inondations.

solution_groups:
  protect: "Protéger les emprises et les sites"
  baselines: "États initiaux et registres"
  change: "Changements et environnement"
  capture: "Drones, images et détection sur mesure"

service_groups:
  structures: "Constructions dans les emprises et les périmètres"
  change: "Changements et relevés périodiques"
  features: "Détection d'éléments précis"
  terrain: "Relief, eau et zones de danger"
  baselines: "États initiaux fonciers et sociaux"
  capture: "Drones et images"
  delivery: "Rapports et livraison"

solutions:
  right-of-way-monitoring:
    name: "Suivi des emprises et des servitudes"
    blurb: Un registre initial des constructions par distance à votre ligne, puis de nouveaux relevés selon un calendrier convenu avec vous et un avis de ce qui a changé.
  encroachment-surveys:
    name: "Relevés de concessions et de limites"
    blurb: Les constructions à l'intérieur d'une concession, d'un site ou d'une limite, dans une bande autour, ou les deux, cartographiées et listées pour voir où le terrain est occupé.
  hazard-zone-registers:
    name: "Constructions en zones de danger"
    blurb: Les constructions dans les zones de sécurité, de résidus, de tir ou d'inondation fixées par vos ingénieurs, chacune avec sa distance à la source.
  excavation-mapping:
    name: "Fouilles et terres remuées"
    blurb: Fosses, fouilles récentes, remblais et nouvelles pistes cartographiés d'une date à l'autre, pour que vos équipes de terrain sachent où vérifier.
  resettlement-cut-off-baselines:
    name: "Registres à la date butoir"
    blurb: Un registre daté des constructions dans l'emprise du projet à la date butoir, pour appuyer le recensement et l'inventaire des biens selon la norme de performance 5 de la SFI.
  route-site-selection:
    name: "Choix de tracés et de sites"
    blurb: Les constructions comptées le long des variantes de tracé ou sur les sites candidats, pour peser l'impact foncier avant de fixer le tracé.
  imagery-history-due-diligence:
    name: "Historique d'images et due diligence foncière"
    blurb: Ce qui se trouvait sur une parcelle, un tracé ou un site, et à peu près quand, d'après les archives d'images satellite et les données ouvertes.
  evidence-packs:
    name: "Dossiers documentaires et examen des réclamations"
    blurb: Images datées, registres et cartes réunis avec l'empreinte numérique de chaque fichier et un horodatage indépendant, à l'appui des démarches juridiques et communautaires.
  household-estimates:
    name: "Estimations de ménages"
    blurb: Couches de constructions et ménages estimés pour dimensionner des mini-réseaux et planifier les services et les consultations, avec les hypothèses indiquées.
  change-detection:
    name: "Détection des changements et relevés périodiques"
    blurb: Les constructions nouvelles ou disparues entre deux relevés datés, signalées automatiquement et confirmées par un analyste, avec des vues avant et après.
  vegetation-land-cover-fire:
    name: "Végétation, occupation du sol et feux"
    blurb: Là où la végétation a été coupée, a repoussé ou a brûlé le long des emprises, dans les domaines et les concessions, d'une date à l'autre.
  terrain-flood-post-event:
    name: "Relief, inondations et après-événement"
    blurb: Les tronçons en pente, sujets à l'érosion ou exposés aux crues, et une comparaison avant et après le long de votre tracé après les orages et les inondations.
  drone-surveys:
    name: "Levés par drone"
    blurb: Orthophotos, modèles d'élévation et volumes là où le détail compte, sous réserve des autorisations et habilitations de sécurité que chaque mission exige.
  imagery:
    name: "Images : les vôtres, d'archive ou nouvelle prise de vue"
    blurb: L'analyse des images que vous détenez déjà, des scènes datées d'archive à très haute résolution ou une nouvelle prise de vue satellite de votre site.
  custom-detection:
    name: "Détection sur mesure"
    blurb: Une détection adaptée à vos images et à ce qui compte sur votre terrain, vérifiée sur une partie de la zone avant d'être appliquée au reste.
